services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: whimsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: whimsync
      POSTGRES_PASSWORD: whimsync_dev_pass
      POSTGRES_DB: whimsync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whimsync -d whimsync"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    container_name: whimsync-redis
    restart: unless-stopped
    # Memory limits below assume a host with 4GB RAM / 50GB storage that also
    # runs Postgres, MinIO and the app. maxmemory (512mb) is roughly an eighth
    # of RAM; the container limit (768m) is ~1.5x that to leave room for
    # snapshot fork overhead and fragmentation. noeviction is used so queued or
    # persisted data is never silently dropped. Adjust if the host specs change.
    command: valkey-server --save 60 1 --loglevel warning --maxmemory 512mb --maxmemory-policy noeviction
    deploy:
      resources:
        limits:
          memory: 768m
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Silo: community-maintained fork of MinIO (upstream minio/minio was
    # archived Apr 2026). Pin to a release tag; never use :latest.
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: whimsync-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: whimsync
      MINIO_ROOT_PASSWORD: whimsync_dev_pass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mcli", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z
    container_name: whimsync-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set whimsync http://minio:9000 whimsync whimsync_dev_pass;
      mc mb whimsync/whimsync-cold --ignore-existing;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
